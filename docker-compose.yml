name: cryptolens
x-app: &app
  build: ./backend
  env_file: .env
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: cryptolens
      POSTGRES_DB: cryptolens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cryptolens]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m
  redis:
    image: redis:7-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: [redis-server, --appendonly, "yes", --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 96m
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
  backend:
    <<: *app
    ports: [127.0.0.1:8100:8000]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10
  ingestion-worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: [127.0.0.1:3100:3100]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3100').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  redis_data:
